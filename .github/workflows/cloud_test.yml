name: Cloud translation test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/java/eu/kanade/translation/**"
      - "domain/src/main/java/tachiyomi/domain/translation/**"
      - "scripts/cloud-build.sh"
      - ".github/workflows/cloud_test.yml"
  push:
    branches:
      - main
    paths:
      - "app/src/main/java/eu/kanade/translation/**"
      - "domain/src/main/java/tachiyomi/domain/translation/**"
      - "scripts/cloud-build.sh"
      - ".github/workflows/cloud_test.yml"

jobs:
  test:
    name: Compile translation modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@cc4fc85e6b35bafd578d5ffbc76a5518407e1af0 # v4.2.1

      - name: Run cloud build script
        run: scripts/cloud-build.sh :app:compileStandardDebugKotlin :domain:compileKotlin
